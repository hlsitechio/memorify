# Netlify config for Memorify — frontend (Vite SPA) + backend (Deno Edge Functions)
# Proprietary. Source maps disabled. Secrets via Netlify env only.

# ── Frontend build (Vite SPA) ──────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "20"
  # CRITICAL: do NOT set NODE_ENV=production here.
  # npm skips devDependencies when NODE_ENV=production, so vite is missing
  # and `npm run build` fails with: sh: 1: vite: not found (exit 127).
  # `vite build` already produces a production bundle on its own.
  NPM_CONFIG_PRODUCTION = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "true"

# ── Context: production only (no branch deploys / previews) ─
[context.deploy-preview]
  command = "echo 'Deploy previews disabled for proprietary repo' && exit 1"

[context.branch-deploy]
  command = "echo 'Branch deploys disabled — main only' && exit 1"

# ── Edge Functions ────────────────────────────────────────
[[edge_functions]]
  function = "api"
  path = "/api/*"

[[edge_functions]]
  function = "mcp"
  path = "/mcp"

[[edge_functions]]
  function = "mcp"
  path = "/mcp/*"

# ── Block source maps on the CDN (belt + suspenders) ──────
[[redirects]]
  from = "/*.map"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/*.map"
  to = "/404.html"
  status = 404
  force = true

# ── SPA fallback ──────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ── Security headers ──────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Discourage scrapers / archive bots on app surfaces
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Never serve maps even if present
[[headers]]
  for = "/*.map"
  [headers.values]
    Cache-Control = "no-store"
