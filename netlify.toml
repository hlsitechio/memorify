# Netlify config for Memorify — frontend (Vite SPA) + backend (Deno Edge Functions)
# No Supabase. No Lovable. Just Netlify + Neon.

# ── Frontend build (Vite SPA) ──────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "20"

# ── Edge Functions declaration ────────────────────────────
# Edge functions run on Deno — same runtime as our backend.
# Env vars (NEON_DATABASE_URL, MEMORIFY_AGENT_TOKEN_SECRET, CLERK_*) 
# are set via Netlify CLI: netlify env:set

[[edge_functions]]
  function = "api"
  path = "/api/*"

[[edge_functions]]
  function = "mcp"
  path = "/mcp"

[[edge_functions]]
  function = "mcp"
  path = "/mcp/*"

# ── SPA fallback ──────────────────────────────────────────
# Let react-router handle client-side routes (deep links, refresh).
# edge_functions take priority over redirects, so /api/* and /mcp hit the
# functions first, everything else falls through to the SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ── Security headers ──────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Never cache the HTML shell
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite fingerprints assets — cache them hard
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"