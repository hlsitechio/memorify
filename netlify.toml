# Netlify config for Memorify (Vite/React SPA). Backend stays on Supabase.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — let react-router handle client-side routes (deep links, refresh).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the HTML shell so new deploys are picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite fingerprints assets — safe to cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
