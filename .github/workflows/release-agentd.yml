name: Release Memorify Remote (agentd)

# Builds the Electron installer for Windows and publishes it to GitHub
# Releases. Triggered by a tag push matching v* (e.g. v0.1.0).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/agentd/package-lock.json

      - name: Install dependencies
        working-directory: packages/agentd
        run: npm install --no-audit --no-fund

      - name: Build + package Windows installer
        working-directory: packages/agentd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Publish to GitHub Releases
        working-directory: packages/agentd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
